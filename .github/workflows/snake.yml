name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3f6c9f&color_dots=#efefec,#c9d4e6,#8fb0d3,#3f6c9f,#1b2c44&color_dot_border=#e3e4e8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c9d4e6&color_dots=#1e1f24,#2a3550,#2a4060,#5a83b5,#c9d4e6&color_dot_border=#2a2c33

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
